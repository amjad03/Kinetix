<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" width="1440" height="400">
  <!-- Zynetix wordmark: the mark plus the name in a geometric sans (outline the text for print). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0B5F73"/>
    </linearGradient>
  </defs>
  <g transform="translate(40 40) scale(0.625)">
    <rect width="512" height="512" rx="120" fill="url(#tile)"/>
    <path d="M150 156 H340 L160 356 H362" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="390" cy="128" r="30" fill="#FFB547"/>
  </g>
  <text x="420" y="262" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="190" font-weight="700" letter-spacing="-4" fill="#0B3B47">Zynetix</text>
</svg>
