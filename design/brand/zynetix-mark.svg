<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Zynetix mark: a Z drawn as one pen stroke on a teal tile, with an amber spark where the pen
       lifts. Master artwork: the app icons are rendered from these shapes (design/brand/render_icons.py). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0B5F73"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#tile)"/>
  <path d="M150 156 H340 L160 356 H362" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="390" cy="128" r="30" fill="#FFB547"/>
</svg>
