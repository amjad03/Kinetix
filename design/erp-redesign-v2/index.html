<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetix ERP v2</title>
<style>
:root{
  --bg:#f7f7f8;--card:#fff;--border:#ececee;--border-strong:#dcdce1;--text:#18181b;--muted:#5d5e66;--faint:#8b8c94;
  --primary:#18181b;--primary-fg:#fff;--hover:#f3f3f5;--active:#ededf0;
  --teal:#0f9488;--teal-ink:#0f766e;--teal-soft:#e3f5f2;
  --amber:#f59e0b;--amber-ink:#a35c06;--amber-soft:#fdf2d6;
  --orange:#f97316;--orange-ink:#c2410c;--orange-soft:#ffeddc;
  --red:#ef4444;--red-ink:#b91c1c;--red-soft:#fde6e6;
  --green:#22c55e;--green-ink:#15803d;--green-soft:#dcf5e5;
  --blue:#3b82f6;--blue-ink:#1d4ed8;--blue-soft:#e0eafe;
  --violet:#7c3aed;--violet-ink:#6d28d9;--violet-soft:#ede7fe;
  --pink:#db2777;--pink-ink:#be185d;--pink-soft:#fce4ef;
  --sky:#0284c7;--sky-ink:#0369a1;--sky-soft:#dff1fb;
  --indigo:#4f46e5;--indigo-ink:#4338ca;--indigo-soft:#e5e7fd;
  --lime:#65a30d;--lime-ink:#4d7c0f;--lime-soft:#ecf6d8;
  --slate:#64748b;--slate-ink:#475569;--slate-soft:#eef1f5;
  --ring:#0f9488;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);
  --shadow-lg:0 20px 50px -12px rgba(16,24,40,.25);
  --r:14px;--r-sm:10px;--sbw:264px;--dot:#d9d9de;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0e;--card:#151518;--border:#26262c;--border-strong:#34343b;--text:#f4f4f5;--muted:#a6a6b0;--faint:#7c7c86;
  --primary:#f4f4f5;--primary-fg:#18181b;--hover:#1e1e23;--active:#26262c;
  --teal:#14b8a6;--teal-ink:#5eead4;--teal-soft:rgba(20,184,166,.15);
  --amber-ink:#fcd34d;--amber-soft:rgba(245,158,11,.16);--orange-ink:#fdba74;--orange-soft:rgba(249,115,22,.16);
  --red-ink:#fca5a5;--red-soft:rgba(239,68,68,.16);--green-ink:#86efac;--green-soft:rgba(34,197,94,.15);
  --blue:#60a5fa;--blue-ink:#93c5fd;--blue-soft:rgba(59,130,246,.18);--violet:#a78bfa;--violet-ink:#c4b5fd;--violet-soft:rgba(139,92,246,.18);
  --pink:#f472b6;--pink-ink:#f9a8d4;--pink-soft:rgba(236,72,153,.17);--sky:#38bdf8;--sky-ink:#7dd3fc;--sky-soft:rgba(14,165,233,.17);
  --indigo:#818cf8;--indigo-ink:#a5b4fc;--indigo-soft:rgba(99,102,241,.18);--lime:#a3e635;--lime-ink:#bef264;--lime-soft:rgba(132,204,22,.15);
  --slate:#94a3b8;--slate-ink:#cbd5e1;--slate-soft:rgba(148,163,184,.14);
  --shadow:none;--shadow-lg:0 20px 50px -12px rgba(0,0,0,.6);--dot:#2a2a31;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c0c0e;--card:#151518;--border:#26262c;--border-strong:#34343b;--text:#f4f4f5;--muted:#a6a6b0;--faint:#7c7c86;
  --primary:#f4f4f5;--primary-fg:#18181b;--hover:#1e1e23;--active:#26262c;
  --teal:#14b8a6;--teal-ink:#5eead4;--teal-soft:rgba(20,184,166,.15);
  --amber-ink:#fcd34d;--amber-soft:rgba(245,158,11,.16);--orange-ink:#fdba74;--orange-soft:rgba(249,115,22,.16);
  --red-ink:#fca5a5;--red-soft:rgba(239,68,68,.16);--green-ink:#86efac;--green-soft:rgba(34,197,94,.15);
  --blue:#60a5fa;--blue-ink:#93c5fd;--blue-soft:rgba(59,130,246,.18);--violet:#a78bfa;--violet-ink:#c4b5fd;--violet-soft:rgba(139,92,246,.18);
  --pink:#f472b6;--pink-ink:#f9a8d4;--pink-soft:rgba(236,72,153,.17);--sky:#38bdf8;--sky-ink:#7dd3fc;--sky-soft:rgba(14,165,233,.17);
  --indigo:#818cf8;--indigo-ink:#a5b4fc;--indigo-soft:rgba(99,102,241,.18);--lime:#a3e635;--lime-ink:#bef264;--lime-soft:rgba(132,204,22,.15);
  --slate:#94a3b8;--slate-ink:#cbd5e1;--slate-soft:rgba(148,163,184,.14);
  --shadow:none;--shadow-lg:0 20px 50px -12px rgba(0,0,0,.6);--dot:#2a2a31;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* tones: tile / pill colours */
.t-violet{--tc:var(--violet);--ts:var(--violet-soft);--ti:var(--violet-ink)}
.t-orange{--tc:var(--orange);--ts:var(--orange-soft);--ti:var(--orange-ink)}
.t-sky{--tc:var(--sky);--ts:var(--sky-soft);--ti:var(--sky-ink)}
.t-amber{--tc:var(--amber);--ts:var(--amber-soft);--ti:var(--amber-ink)}
.t-teal{--tc:var(--teal);--ts:var(--teal-soft);--ti:var(--teal-ink)}
.t-blue{--tc:var(--blue);--ts:var(--blue-soft);--ti:var(--blue-ink)}
.t-pink{--tc:var(--pink);--ts:var(--pink-soft);--ti:var(--pink-ink)}
.t-green{--tc:var(--green);--ts:var(--green-soft);--ti:var(--green-ink)}
.t-indigo{--tc:var(--indigo);--ts:var(--indigo-soft);--ti:var(--indigo-ink)}
.t-red{--tc:var(--red);--ts:var(--red-soft);--ti:var(--red-ink)}
.t-lime{--tc:var(--lime);--ts:var(--lime-soft);--ti:var(--lime-ink)}
.t-slate{--tc:var(--slate);--ts:var(--slate-soft);--ti:var(--slate-ink)}
.tile{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--ts);color:var(--tc);flex:none}
.tile.lg{width:40px;height:40px;border-radius:11px}
.tile.md{width:34px;height:34px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ts,var(--hover));color:var(--ti,var(--muted));white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--tc,var(--faint))}
.delta{font-size:12.5px;font-weight:600;white-space:nowrap}.delta.up{color:var(--green-ink)}.delta.dn{color:var(--red-ink)}

/* layout */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);height:100vh;transition:grid-template-columns .2s}
.app.collapsed{--sbw:72px}
.sidebar{height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40}
.main{min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);flex:none}
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}

/* sidebar */
.sb-head{padding:14px 12px 6px;position:relative}
.org{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;text-align:left}
.org:hover{background:var(--hover)}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#0f9488,#4f46e5);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.org-t{min-width:0;flex:1}
.org-t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-t span{display:block;font-size:12px;color:var(--muted)}
.sb-nav{padding:2px 12px 12px;flex:1}
.grp{margin-top:12px}
.grp-h{display:flex;align-items:center;width:100%;padding:4px 8px;border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--faint);border-radius:6px}
.grp-h:hover{color:var(--text)}
.grp-h .ic{margin-left:auto;transition:transform .15s;opacity:0}
.grp-h:hover .ic,.grp.closed .grp-h .ic{opacity:1}
.grp.closed .grp-h .ic{transform:rotate(-90deg)}
.grp.closed .grp-items{display:none}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;margin:1px 0;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--text);font-weight:500;text-align:left;position:relative;font-size:13.5px}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--active);font-weight:600}
.nav-i .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-i .tile{width:24px;height:24px;border-radius:7px}
.nav-sub{margin:2px 0 4px 20px;padding-left:12px;border-left:1px solid var(--border)}
.nav-sub .nav-i{padding:5px 8px;color:var(--muted);font-size:13px}
.nav-sub .nav-i.on{color:var(--text)}
.nbadge{font-size:11px;font-weight:600;min-width:20px;text-align:center;padding:0 6px;border-radius:99px;background:var(--red-soft);color:var(--red-ink)}
.fav-i .av{width:22px;height:22px;font-size:10px}
.fav-i .meta{font-size:11.5px;color:var(--faint);font-weight:400}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border);position:relative}
.me{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left}
.me:hover{background:var(--hover)}
.app.collapsed .lbl,.app.collapsed .grp-h span,.app.collapsed .org-t,.app.collapsed .org>.ic,.app.collapsed .nbadge,.app.collapsed .me .org-t,.app.collapsed .me>.ic,.app.collapsed .grp-h .ic,.app.collapsed .nav-sub,.app.collapsed .fav-i .meta{display:none}
.app.collapsed .nav-i{justify-content:center;padding:6px}
.app.collapsed .grp-h{justify-content:center;height:10px;padding:0}
.app.collapsed .grp-h::after{content:"";width:16px;height:1px;background:var(--border-strong)}
.app.collapsed .org{justify-content:center;padding:6px}
.app.collapsed .grp.closed .grp-items{display:block}
.pop{position:absolute;z-index:80;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:220px}
.pop-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px}
.pop-i:hover,.pop-i:focus-visible{background:var(--hover)}
.pop-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px 4px}
.pop-sep{height:1px;background:var(--border);margin:6px 0}

/* topbar */
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);position:relative;flex:none}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn.bd{border-color:var(--border);background:var(--card)}
.ibtn.sm{width:28px;height:28px;border-radius:8px}
.ibtn.on{background:var(--active);color:var(--text)}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid var(--card)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;white-space:nowrap;min-width:0}
.crumb b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.vsep{width:1px;height:20px;background:var(--border);flex:none}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;width:min(300px,30vw);margin-left:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--muted);cursor:pointer}
.search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
kbd{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;color:var(--muted);background:var(--card)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;flex:none;width:32px;height:32px;font-size:12px;position:relative}
.av.s{width:26px;height:26px;font-size:10.5px}.av.l{width:40px;height:40px;font-size:14px}
.av-0{background:#d7f2ee;color:#0b5e57}.av-1{background:#fdecc8;color:#7a4405}.av-2{background:#e3e8f0;color:#334155}
.av-3{background:#ffe2cc;color:#9a3412}.av-4{background:#dde7fd;color:#1e3a8a}.av-5{background:#f9dde7;color:#9d174d}.av-6{background:#ebe3fd;color:#5b21b6}
:root[data-theme="dark"] .av{filter:saturate(.85) brightness(.88)}
.av .on-d{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.stack{display:flex}.stack .av{border:2px solid var(--card);margin-left:-8px}.stack .av:first-child{margin-left:0}

/* tab bar (browser style) */
.tabbar{display:flex;align-items:flex-end;gap:2px;height:42px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--border);flex:none;position:relative}
.tabs{display:flex;align-items:flex-end;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;min-width:120px;max-width:200px;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;background:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;position:relative;flex:none}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.on{background:var(--card);border-color:var(--border);color:var(--text);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--card)}
.tab.split{box-shadow:inset 0 2px 0 var(--violet)}
.tab .tile{width:20px;height:20px;border-radius:6px}
.tab .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tab .x{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;color:var(--faint)}
.tab .x:hover{background:var(--active);color:var(--text)}
.tabbar .ibtn{margin-bottom:4px}
.tabbar-r{margin-left:auto;display:flex;gap:2px;padding-left:8px}

/* workspace + panes */
.ws{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.ws.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{min-width:0;min-height:0;overflow:auto;position:relative;container-type:inline-size}
.ws.split .pane+.pane{border-left:1px solid var(--border)}
.pane-h{display:none;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:5;font-size:12.5px;color:var(--muted)}
.ws.split .pane-h{display:flex}
.page{padding:24px;max-width:1440px;margin:0 auto}
.page.fill{padding:0;max-width:none;height:100%;display:flex;flex-direction:column}
.pane-c:has(>.page.fill){height:100%}
.ws.split .pane-c:has(>.page.fill){height:calc(100% - 41px)}

/* components */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:24px;line-height:1.25;margin:0;font-weight:650;letter-spacing:-.015em}
.ph p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:550;white-space:nowrap;font-size:13.5px;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.pri:hover{opacity:.9}
.btn.acc{background:#4f46e5;color:#fff;border-color:#4f46e5}
.btn.acc:hover{opacity:.92}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--red-ink);border-color:color-mix(in srgb,var(--red) 35%,var(--border))}
.btn.block{width:100%;height:40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 0}
.card-h h3{font-size:15px;margin:0;font-weight:600}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.card-b{padding:16px 20px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.input{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);width:100%;min-width:0}
.input:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 18%,transparent)}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-size:13px;font-weight:550}
.field .hint{font-size:12px;color:var(--faint)}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap .ic{position:absolute;left:11px;color:var(--faint);pointer-events:none}
.inwrap .input{padding-left:34px}
.inwrap .suf{position:absolute;right:6px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--border);border-radius:10px;background:var(--bg);gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow),0 0 0 1px var(--border)}
.utabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.utabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:550;font-size:13.5px;position:relative;white-space:nowrap;display:flex;gap:6px;align-items:center}
.utabs button:hover{color:var(--text)}
.utabs button.on{color:var(--text)}
.utabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--text)}
.utabs .cnt{font-size:11px;padding:0 6px;border-radius:99px;background:var(--hover);color:var(--muted)}
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:var(--border-strong);border:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw.on{background:var(--teal)}.sw.on::after{transform:translateX(16px)}
.chk{width:16px;height:16px;accent-color:var(--teal)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:550;color:var(--muted);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:color-mix(in srgb,var(--bg) 55%,var(--card))}

  ${n.warn?`<div class="row sm" style="padding:10px 12px;border-radius:10px;background:var(--orange-soft);color:var(--orange-ink)">${I('alert',15)}Choose the ledger account before activating.</div>`:''}</div>

PAGES.workflow={r:()=>`<div class="page fill"><div class="wf"><div class="wf-top"><button class="ibtn sm" data-act="open" data-p="workflows" aria-label="Back to workflows">${I('chevleft',18)}</button><b style="font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(WF.name)}</b>${pill(WF.status,WF.status==='Active'?'green':'amber')}<span class="xs muted">v${WF.ver}</span><span class="sp"></span>
  <div style="position:relative"><button class="btn sm acc" data-act="wfAddMenu">${I('plus',14)}Add a node</button></div><button class="btn sm ghost hide-m" data-act="open" data-p="runs">${I('play',13)}See runs</button><button class="btn sm ghost hide-m" data-act="wfDiscard">${I('history',14)}Discard draft</button><button class="btn sm" data-act="wfActivate">${I(WF.status==='Active'?'check':'zap',14)}${WF.status==='Active'?'Active':'Activate'}</button></div>
  <div class="wf-body"><div style="flex:1;min-width:0;position:relative;display:flex"><div class="canvas" id="cv"><div class="canvas-in" style="transform:scale(${WF.zoom})">${seq(WF.main,'main')}${edge('main',WF.main.length)}<div class="xs faint" style="margin-top:6px">End</div></div></div>
  <div class="minimap">${I('workflow',13)} ${countNodes()} steps · ${Math.round(WF.zoom*100)}%</div>
  <div class="zoom"><button class="ibtn sm" aria-label="Zoom in" data-act="wfZoom" data-v="0.1">${I('plus',15)}</button><button class="ibtn sm" aria-label="Zoom out" data-act="wfZoom" data-v="-0.1">${I('minus',15)}</button><button class="ibtn sm" aria-label="Fit" data-act="wfZoom" data-v="0">${I('max',14)}</button></div></div>
  ${WF.sel?`<aside class="wf-panel" aria-label="Edit step">${wfPanel()}</aside>`:''}</div></div></div>`,
  init:p=>{const cv=$('.canvas',p);if(!cv)return;let d=null;cv.onpointerdown=e=>{if(e.target.closest('button'))return;d={x:e.clientX,y:e.clientY,l:cv.scrollLeft,t:cv.scrollTop};cv.style.cursor='grabbing'};cv.onpointermove=e=>{if(!d)return;cv.scrollLeft=d.l-(e.clientX-d.x);cv.scrollTop=d.t-(e.clientY-d.y)};cv.onpointerup=cv.onpointerleave=()=>{d=null;cv.style.cursor=''};
    const c=$('.canvas-in',cv);cv.scrollLeft=(c.scrollWidth-cv.clientWidth)/2}};
function countNodes(a=WF.main){return a.reduce((s,n)=>s+1+(n.t==='condition'?countNodes(n.yes)+countNodes(n.no):0),0)}
ACT.wfSel=el=>{WF.sel=el.dataset.id;rerender('workflow')};
ACT.wfClose=ACT.wfDone=()=>{WF.sel=null;rerender('workflow')};
ACT.wfZoom=el=>{const v=+el.dataset.v;WF.zoom=v?Math.min(1.5,Math.max(.5,+(WF.zoom+v).toFixed(1))):1;rerender('workflow')};
const NEWN={approval:['New approval','Pick an approver',{approver:'Mentor',sla:'2 days'}],notify:['Send notification','Choose channels',{channels:'SMS, App push',template:'Generic update'}],action:['Update record','Choose target',{target:'Next unpaid instalment'}],delay:['Wait','Pause before continuing',{wait:'1 day'}],condition:['New condition','Split the flow',{field:'Category',op:'equals',val:'SC/ST'}]};
function addNode(type,path,i){const [k,br]=path.split(':');const arr=k==='main'?WF.main:findNode(k)[br];const n={id:'n'+(nid++),t:type,n:NEWN[type][0],d:NEWN[type][1],cfg:{...NEWN[type][2]}};if(type==='condition'){n.yes=[];n.no=[]}arr.splice(i,0,n);WF.sel=n.id;rerender('workflow');toast(NT[type][0]+' added')}
function addMenu(anchor,path,i){showPop(anchor,`<div class="pop-h">Add step</div>${Object.keys(NEWN).map(k=>`<button class="pop-i" data-act="wfAdd" data-t="${k}" data-path="${path}" data-i="${i}">${tile(NT[k][1],NT[k][2])}${NT[k][0]}</button>`).join('')}`,'right')}
ACT.wfAddMenu=el=>addMenu(el,'main',WF.main.length);
ACT.wfAddAt=el=>addMenu(el,el.dataset.path,+el.dataset.i);
ACT.wfAdd=el=>addNode(el.dataset.t,el.dataset.path,+el.dataset.i);
ACT.wfDel=()=>{const r=findArr(WF.sel);if(r){r[0].splice(r[1],1);WF.sel=null;rerender('workflow');toast('Step deleted')}};
ACT.wfActivate=()=>{const w=findNode('n6');if(w&&w.warn){WF.sel='n6';rerender('workflow');toast('Fix “Update fee ledger” before activating');return}WF.status='Active';WF.ver++;WFS[0][2]='Active';WFS[0][3]='green';rerender('workflow');toast('Workflow activated · v'+WF.ver)};
ACT.wfDiscard=()=>toast('Draft changes discarded (prototype)');
const liveNode=(el,fn)=>{const n=findNode(WF.sel);fn(n);$$(`.node[data-id="${n.id}"] .n`).forEach(x=>x.textContent=n.n);$$('.wf-panel .drawer-h b').forEach(x=>x.textContent=n.n)};
INP.wfName=el=>liveNode(el,n=>n.n=el.value);INP.wfDesc=el=>liveNode(el,n=>n.d=el.value);
INP.wfCfgI=el=>liveNode(el,n=>n.cfg[el.dataset.k]=el.value);
CHG.wfCfg=el=>{liveNode(el,n=>{n.cfg[el.dataset.k]=el.value;if(n.id==='n6'){n.warn=0;rerender('workflow')}})};

/* ================= AUTH ================= */
const AU={mode:'email',showPw:false,sent:false,step:0,t:30,timer:null};
function authArt(){const a={signin:['Welcome back to campus','Attendance, fees, results and every approval — one place for Soundarya\'s 4,400 students and 214 staff.','Sign in with your institution code','Your code is printed on your staff ID card. Ask the office if you have not received one.'],signup:['Bring your institution online','Set up Kinetix in an afternoon: import students, map fee heads and invite your faculty.','Free onboarding support','Our team migrates last year\'s data from spreadsheets or your old ERP at no cost.'],forgot:['Locked out? It happens.','We will send a reset code to the phone or email registered with your institution.','Check your SMS inbox','Codes arrive from KINETX. They expire in 10 minutes and work only once.'],otp:['One more step','A 6-digit code keeps payroll, results and student records safe.','Keep your account secure','Never share an OTP — Kinetix staff will never ask for it.'],setup:['Let\'s set up Soundarya','Three quick steps and your staff can start marking attendance today.','You can change this later','Everything here is editable from Settings.']}[S.auth];
  return `<div class="auth-art"><svg class="bg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="aa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f9488"/><stop offset=".55" stop-color="#312e81"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="600" height="800" fill="url(#aa)"/>${Array.from({length:9},(_,i)=>`<path d="M-50 ${120+i*70} C 150 ${40+i*70}, 350 ${220+i*70}, 650 ${100+i*70}" fill="none" stroke="rgba(255,255,255,${.05+i*.012})" stroke-width="${18-i}"/>`).join('')}<circle cx="520" cy="110" r="70" fill="rgba(255,255,255,.07)"/></svg>
  <div><h2>${a[0]}</h2><p>${a[1]}</p></div><div class="glass"><div class="row"><b style="font-size:18px;flex:1">${a[2]}</b><span class="logo" style="width:40px;height:40px">S</span></div><p>${a[3]}</p><div class="row" style="margin-top:14px"><div class="stack">${['Prof. Deepa Nair','Dr. Ramesh Kulkarni','Anita Fernandes','Lakshmi Prasad'].map(n=>AV(n,'s')).join('')}</div><span class="xs" style="color:#5d5e66">214 staff signed in this week</span></div></div></div>`}
function authForm(){const brand=`<div class="row"><span class="logo">K</span><b style="font-size:17px">Kinetix</b></div>`;
  if(S.auth==='signin')return `${brand}<div><h1>Sign in to Kinetix</h1></div><p class="sub">Use your institution code and staff credentials.</p>
   <div class="grid g2" style="gap:10px"><button class="btn" data-act="auSSO">${GOOGLE}Google</button><button class="btn" data-act="auSSO">${MSFT}Microsoft</button></div><div class="or">or continue with</div>
   <form class="col" style="gap:14px" data-sub="auSignin"><div class="field"><label for="au-c">Institution code*</label><div class="inwrap">${I('building',15)}<input id="au-c" class="input" value="SIMS-BLR" required></div></div>
   <div class="field"><div class="row"><span class="lab sp">Sign in with</span><div class="seg" role="group">${[['email','Email'],['phone','Phone']].map(m=>`<button type="button" class="${AU.mode===m[0]?'on':''}" data-act="auMode" data-v="${m[0]}">${m[1]}</button>`).join('')}</div></div><div class="inwrap">${I(AU.mode==='email'?'mail':'smartphone',15)}<input class="input" aria-label="${AU.mode==='email'?'Email address':'Phone number'}" ${AU.mode==='email'?'type="email" placeholder="you@soundarya.edu.in"':'type="tel" placeholder="+91 98xxx xxxxx"'} required></div></div>
   <div class="field"><div class="row"><label for="au-p" class="sp">Password*</label><button type="button" class="link sm" data-act="auGo" data-v="forgot">Forgot password?</button></div><div class="inwrap">${I('lock',15)}<input id="au-p" class="input" type="${AU.showPw?'text':'password'}" placeholder="••••••••" required><button type="button" class="ibtn sm suf" data-act="auPw" aria-label="${AU.showPw?'Hide':'Show'} password">${I('eye',15)}</button></div></div>
   <label class="row sm"><input type="checkbox" class="chk" checked> Keep me signed in on this device</label>
   <button class="btn pri block">Sign in</button></form>
   <button class="btn block" data-act="auGo" data-v="otp">${I('smartphone',15)}Sign in with OTP instead</button>
   <p class="sm muted" style="text-align:center;margin:0">New institution? <button class="link" data-act="auGo" data-v="signup">Register</button> · <button class="link" data-act="auGo" data-v="setup">First-time setup</button></p>`;
  if(S.auth==='signup')return `${brand}<div><h1>Register your institution</h1></div><p class="sub">Start a 30-day pilot. No card needed.</p><form class="col" style="gap:14px" data-sub="auSignup"><div class="grid g2" style="gap:12px"><div class="field"><label for="su-n">Your name*</label><input id="su-n" class="input" placeholder="Dr. Savitha Hegde" required></div><div class="field"><label for="su-r">Role</label><select id="su-r" class="input"><option>Principal</option><option>Director</option><option>Administrator</option></select></div></div><div class="field"><label for="su-i">Institution*</label><input id="su-i" class="input" placeholder="Soundarya Institute" required></div><div class="field"><label for="su-e">Work email*</label><input id="su-e" type="email" class="input" placeholder="principal@college.edu.in" required></div><div class="field"><label for="su-p">Mobile*</label><input id="su-p" type="tel" class="input" placeholder="+91" required></div><div class="field"><label for="su-pw">Password*</label><input id="su-pw" type="password" class="input" data-in="auStrength" required><div class="steps" id="pw-s"><i></i><i></i><i></i><i></i></div><span class="hint">8+ characters with a number and a symbol</span></div><label class="row sm" style="align-items:flex-start"><input type="checkbox" class="chk" required style="margin-top:3px"> I agree to the Kinetix terms and data processing agreement</label><button class="btn pri block">Create account</button></form><div class="or">or</div><button class="btn block" data-act="auSSO">${GOOGLE}Sign up with Google Workspace</button><p class="sm muted" style="text-align:center;margin:0">Already on Kinetix? <button class="link" data-act="auGo" data-v="signin">Sign in</button></p>`;
  if(S.auth==='forgot')return `${brand}<div><h1>${AU.sent?'Check your phone':'Forgot password?'}</h1></div><p class="sub">${AU.sent?'We sent a 6-digit reset code to ******4127 and a link to d•••@soundarya.edu.in.':'Enter your institution code and registered email or phone.'}</p>${AU.sent?`<button class="btn pri block" data-act="auGo" data-v="otp">Enter reset code</button><button class="btn block" data-act="auResend">Resend</button>`:`<form class="col" style="gap:14px" data-sub="auForgot"><div class="field"><label for="fp-c">Institution code</label><input id="fp-c" class="input" value="SIMS-BLR"></div><div class="field"><label for="fp-e">Email or phone*</label><input id="fp-e" class="input" placeholder="you@soundarya.edu.in" required></div><button class="btn pri block">Send reset code</button></form>`}<button class="btn ghost" data-act="auGo" data-v="signin">${I('chevleft',15)}Back to sign in</button>`;
  if(S.auth==='otp')return `${brand}<div><h1>Verify it's you</h1></div><p class="sub">Enter the 6-digit code sent to <b>+91 ******4127</b>.</p><form class="col" style="gap:16px" data-sub="auOtp"><div class="field"><div class="row"><span class="lab sp">Code*</span><button type="button" class="link sm" data-act="toast" data-m="Recovery codes (prototype)">Use a recovery code</button></div><div class="otp" role="group" aria-label="One-time password">${Array.from({length:6},(_,i)=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" data-otp="${i}">`).join('')}</div></div><button class="btn pri block">Verify and continue</button></form><p class="sm muted" style="text-align:center;margin:0" id="otp-t">${AU.t>0?`Resend code in 0:${String(AU.t).padStart(2,'0')}`:`Didn't get it? <button class="link" data-act="auResend">Resend</button>`}</p><button class="btn ghost" data-act="auGo" data-v="signin">${I('chevleft',15)}Back to sign in</button>`;
  const st=AU.step;return `${brand}<div class="steps">${[0,1,2].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><div><div class="xs muted">Step ${st+1} of 3</div><h1>${['Institution details','Academic year','Invite your team'][st]}</h1></div>
   <form class="col" style="gap:14px" data-sub="auSetup">${st===0?`<div class="field"><label for="fs-n">Institution name</label><input id="fs-n" class="input" value="Soundarya Institute of Management & Science"></div><div class="field"><span class="lab">Type</span><div class="chooser">${[['cap','teal','Degree college','UG / PG'],['building','indigo','Engineering','AICTE / VTU'],['book','orange','PU college','Class 11–12'],['award','pink','University','Multi-campus']].map((c,i)=>`<button type="button" class="${i===1?'on':''}" data-act="auPick">${tile(c[0],c[1],'md')}<b class="sm">${c[2]}</b><span class="xs muted">${c[3]}</span></button>`).join('')}</div></div><div class="grid g2" style="gap:12px"><div class="field"><label for="fs-s">State</label><select id="fs-s" class="input"><option>Karnataka</option><option>Kerala</option><option>Tamil Nadu</option><option>Maharashtra</option></select></div><div class="field"><label for="fs-c">City</label><input id="fs-c" class="input" value="Bengaluru"></div></div>`
   :st===1?`<div class="grid g2" style="gap:12px"><div class="field"><label for="fy-s">Year starts</label><select id="fy-s" class="input"><option>August</option><option>June</option><option>July</option></select></div><div class="field"><label for="fy-t">Terms</label><select id="fy-t" class="input"><option>2 semesters</option><option>3 trimesters</option><option>Annual</option></select></div></div><div class="field"><label for="fy-a">Attendance threshold</label><select id="fy-a" class="input"><option>75%</option><option>80%</option></select></div><div class="field"><label for="fy-f">Fee collection</label><select id="fy-f" class="input"><option>Online + counter</option><option>Counter only</option></select></div>`
   :`${['Prof. Deepa Nair — deepa.nair@soundarya.edu.in','Lakshmi Prasad — accounts@soundarya.edu.in'].map(x=>`<div class="row" style="padding:10px 12px;border:1px solid var(--border);border-radius:10px">${AV(x.split(' — ')[0],'s')}<span class="sm sp" style="min-width:0;overflow:hidden;text-overflow:ellipsis">${x}</span>${I('check',15)}</div>`).join('')}<div class="field"><label for="fi-e">Add more (comma separated)</label><textarea id="fi-e" class="input" rows="3" placeholder="hod.cse@soundarya.edu.in, office@soundarya.edu.in"></textarea></div>`}
   <div class="row">${st?`<button type="button" class="btn" data-act="auBack">${I('chevleft',15)}Back</button>`:''}<span class="sp"></span><button class="btn pri">${st<2?'Continue':'Finish setup'}${I('arrow',15)}</button></div></form><button class="link sm" style="align-self:center" data-act="auGo" data-v="signin">Skip for now</button>`}
function renderAuth(){clearInterval(AU.timer);root.innerHTML=`<div class="auth"><div class="auth-l"><div class="row"><span class="sp"></span><div class="seg hide-m" role="group" aria-label="Auth screen">${[['signin','Sign in'],['signup','Sign up'],['forgot','Forgot'],['otp','OTP'],['setup','Setup']].map(x=>`<button class="${S.auth===x[0]?'on':''}" data-act="auGo" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><button class="ibtn" data-act="theme" aria-label="Toggle theme">${I(isDark()?'sun':'moon',17)}</button><button class="btn sm" data-act="auEnter">${I('arrow',14)}<span>Open app</span></button></div><div class="auth-form">${authForm()}</div><div class="xs faint" style="text-align:center">© 2026 Kinetix · Made in Bengaluru · <a href="#" data-act="toast" data-m="Privacy policy (prototype)">Privacy</a></div></div><div class="auth-r">${authArt()}</div></div>`;
  if(S.auth==='otp'){const ins=$$('[data-otp]');ins[0].focus();ins.forEach((inp,i)=>{inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus()};inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus()};inp.onpaste=e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'');if(t){e.preventDefault();ins.forEach((x,j)=>x.value=t[j]||'');ins[Math.min(t.length,5)].focus()}}});
    if(AU.t>0)AU.timer=setInterval(()=>{AU.t--;const el=$('#otp-t');if(!el){clearInterval(AU.timer);return}el.innerHTML=AU.t>0?`Resend code in 0:${String(AU.t).padStart(2,'0')}`:`Didn't get it? <button class="link" data-act="auResend">Resend</button>`;if(AU.t<=0)clearInterval(AU.timer)},1000)}}
ACT.auGo=el=>{S.auth=el.dataset.v;if(S.auth==='otp')AU.t=30;if(S.auth==='forgot')AU.sent=false;if(S.auth==='setup')AU.step=0;save();renderAuth()};
ACT.auMode=el=>{AU.mode=el.dataset.v;renderAuth()};
ACT.auPw=el=>{AU.showPw=!AU.showPw;const i=$('#au-p');i.type=AU.showPw?'text':'password'};
ACT.auSSO=()=>toast('Redirecting to your identity provider (prototype)');
ACT.auEnter=()=>{S.view='app';save();render()};
ACT.auResend=()=>{AU.t=30;toast('New code sent');if(S.auth==='otp')renderAuth()};
ACT.auBack=()=>{AU.step--;renderAuth()};
ACT.auPick=el=>{$$('button',el.parentNode).forEach(b=>b.classList.remove('on'));el.classList.add('on')};
INP.auStrength=el=>{const v=el.value;const s=(v.length>=8)+/\d/.test(v)+/[^\w]/.test(v)+/[A-Z]/.test(v);$$('#pw-s i').forEach((i,j)=>{i.className=j<s?'on':'';i.style.background=j<s?['var(--red)','var(--amber)','var(--teal)','var(--green)'][s-1]:''})};
Object.assign(SUB,{auSignin:()=>{toast('Signed in as Dr. Savitha');S.view='app';save();render()},auSignup:()=>{S.auth='otp';AU.t=30;save();renderAuth();toast('Verification code sent')},auForgot:()=>{AU.sent=true;renderAuth()},
  auOtp:f=>{const v=$$('[data-otp]',f).map(i=>i.value).join('');if(v.length<6){toast('Enter all 6 digits');return}S.auth='setup';AU.step=0;save();renderAuth();toast('Verified')},
  auSetup:()=>{if(AU.step<2){AU.step++;renderAuth()}else{S.view='app';save();render();toast('Setup complete — welcome to Kinetix')}}});

/* boot */
if(matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.theme)render()});
render();
</script>
