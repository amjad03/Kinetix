name: kinetix_student
description: "KINETIX Student App: today's classes and homework, live classes, lesson recordings, shared class boards, results, library books, messages, KINETIX AI for doubts, the syllabus library, updates and fees."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kinetix_cast:
    path: ../../packages/kinetix_cast
  kinetix_ui:
    path: ../../packages/kinetix_ui
  kinetix_ink:
    path: ../../packages/kinetix_ink
  kinetix_lesson:
    path: ../../packages/kinetix_lesson
  kinetix_labs:
    path: ../../packages/kinetix_labs
  # The code lab (Learn → Code lab): Python, JavaScript and SQL offline; C, C++ and Java on the server.
  kinetix_cs:
    path: ../../packages/kinetix_cs
  crypto: ^3.0.7
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  razorpay_flutter: ^1.4.7
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  socket_io_client: ^3.1.6
  flutter_pcm_sound: ^3.3.3
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Concept videos: YouTube's embedded player in a WebView.
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
