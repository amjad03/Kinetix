name: kinetix_teacher
description: "KINETIX Teacher App: today's classes, attendance, homework, lesson recordings and connecting to the classroom board."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kinetix_ui:
    path: ../../packages/kinetix_ui
  kinetix_lesson:
    path: ../../packages/kinetix_lesson
  # Printable answer cards (the board reads them from a photo of the class).
  kinetix_cards:
    path: ../../packages/kinetix_cards
  pdf: ^3.11.3
  printing: ^5.14.3
  # Phone remote: a photo from the camera onto the board.
  image_picker: ^1.2.3
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  open_filex: ^4.7.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # UI strings: lib/l10n/app_{en,hi,kn}.arb → AppLocalizations (see l10n.yaml).
  generate: true
