publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  kinetix_ui:
    path: ../../packages/kinetix_ui
  kinetix_lesson:
    path: ../../packages/kinetix_lesson
