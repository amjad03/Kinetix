name: kinetix_board
description: "KINETIX Board: the classroom panel app (Windows panels/OPS PCs and Android panels)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  # PowerPoint import: a .pptx is a zip of XML (lib/features/insert/pptx_render.dart).
  archive: ^4.3.0
  # The document camera (visualiser) in the split panel: the live device camera (lib/features/doc_camera).
  camera: ^0.11.2
  # Windows panels' webcams (camera_windows is not endorsed by camera, so it is listed).
  camera_windows: ^0.2.6
  # The toolkit's timer and stopwatch keep time with it (tests move it with fake_async).
  audioplayers: ^6.8.1
  clock: ^1.1.3
  # PBKDF2 for the kiosk IT PIN (lib/core/kiosk/kiosk_pin.dart).
  crypto: ^3.0.6
  # Pictures, PDFs and PowerPoints from the board's files (Windows) or storage (Android).
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  # Read aloud with the board's own voices (Android TTS, Windows speech); no text leaves it.
  flutter_tts: ^4.2.5
  # Handwriting to text on Android panels: ML Kit Digital Ink, on-device (the language model
  # downloads once from Google; no ink leaves the panel). See lib/core/handwriting.
  google_mlkit_digital_ink_recognition: ^0.16.1
  flutter_map: ^8.3.2
  http: ^1.6.0
  # The gallery and camera on Android panels, and photos of the class for answer cards.
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.9.1
  kinetix_3d:
    path: ../../packages/kinetix_3d
  # Animations for the split panel: photosynthesis, the heart, cell division, the water cycle,
  # circuits... drawn in Flutter, offline (lib/features/board/animations_hook.dart).
  kinetix_animations:
    path: ../../packages/kinetix_animations
  kinetix_cards:
    path: ../../packages/kinetix_cards
  # The CS kit: code lab (Python/JS/SQL on the board, C/C++/Java on the server), algorithms, CS labs.
  kinetix_cs:
    path: ../../packages/kinetix_cs
  kinetix_ink:
    path: ../../packages/kinetix_ink
  kinetix_labs:
    path: ../../packages/kinetix_labs
  kinetix_math:
    path: ../../packages/kinetix_math
  kinetix_ui:
    path: ../../packages/kinetix_ui
  path_provider: ^2.1.6
  # PDF pages drawn on the board itself (PDFium), for PDF import.
  pdfrx: ^2.6.5
  qr_flutter: ^4.1.0
  record: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  # Concept videos: YouTube's embedded player in a WebView (Android; WebView2 on Windows).
  speech_to_text: ^7.5.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_windows: ^0.4.0
  # The slides inside a .pptx.
  xml: ^7.0.1
  flutter_webrtc: ^1.6.2+hotfix.4
  battery_plus: ^7.1.2
  disk_space_plus: ^0.2.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Windows installer: `dart run msix:create` (docs/operations/mobile-release.md, Board).
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true
  # The picture library (lib/features/insert/picture_library.dart): openly licensed diagrams,
  # maps and photos; credits in assets/library/catalog.json and CREDITS.txt.
  assets:
    - assets/library/
    - assets/library/thumbs/
    # PhET sims (lib/features/phet): the catalogue and small thumbnails; the sims themselves
    # download on demand. Built by tools/phet/build-catalogue.mjs (docs/operations/phet.md).
    - assets/phet/
    - assets/phet/thumbs/
    # Simulations hub (lib/features/sim_hub): bundled offline sims, see docs/licensing/SIMULATIONS.md.
    - assets/simhub/phet/
    - assets/simhub/blockly/
    - assets/simhub/blockly/media/
    - assets/sounds/
    - assets/dictionary/
    - assets/history/

# MSIX installer for Windows panels / OPS PCs. Version comes from `version:` above.
# `publisher` must equal the Subject of the code-signing certificate (placeholder until we buy
# one); the certificate itself is passed on the command line, never committed:
#   dart run msix:create --build-windows false --certificate-path <cert.pfx> --certificate-password <pw>
msix_config:
  display_name: KINETIX Board
  publisher_display_name: KINETIX
  identity_name: in.kinetix.board
  publisher: CN=KINETIX, O=KINETIX, C=IN
  capabilities: internetClient,microphone,webcam
  languages: en-in, hi-in, kn-in
  store: false
  install_certificate: false
