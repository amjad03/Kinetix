# MSIX installer for Windows panels / OPS PCs. Version comes from `version:` above.
# `publisher` must equal the Subject of the code-signing certificate (placeholder until we buy
# one); the certificate itself is passed on the command line, never committed:
#   dart run msix:create --build-windows false --certificate-path <cert.pfx> --certificate-password <pw>
msix_config:
  display_name: KINETIX Board
  publisher_display_name: KINETIX
  identity_name: in.kinetix.board
  publisher: CN=KINETIX, O=KINETIX, C=IN
  capabilities: internetClient,microphone,webcam
  languages: en-in, hi-in, kn-in
  store: false
  install_certificate: false
