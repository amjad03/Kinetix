name: kinetix_board
description: "KINETIX Board: the classroom panel app (Windows panels/OPS PCs and Android panels)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  kinetix_3d:
    path: ../../packages/kinetix_3d
  kinetix_ink:
    path: ../../packages/kinetix_ink
  kinetix_labs:
    path: ../../packages/kinetix_labs
  kinetix_math:
    path: ../../packages/kinetix_math
  kinetix_ui:
    path: ../../packages/kinetix_ui
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  record: ^7.1.1
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Windows installer: `dart run msix:create` (docs/operations/mobile-release.md, Board).
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true

# MSIX installer for Windows panels / OPS PCs. Version comes from `version:` above.
# `publisher` must equal the Subject of the code-signing certificate (placeholder until we buy
# one); the certificate itself is passed on the command line, never committed:
#   dart run msix:create --build-windows false --certificate-path <cert.pfx> --certificate-password <pw>
msix_config:
  display_name: KINETIX Board
  publisher_display_name: KINETIX
  identity_name: in.kinetix.board
  publisher: CN=KINETIX, O=KINETIX, C=IN
  capabilities: internetClient,microphone
  languages: en-in, hi-in, kn-in
  store: false
  install_certificate: false
