  <circle cx="12" cy="12" r="6" fill="#99ccff" stroke="#3d6f99"/>
  <text x="24" y="16" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a1a1a">Water</text>
  <circle cx="12" cy="30" r="6" fill="#ff0000" stroke="#8a0000"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a1a1a">Dye</text>
</svg>
