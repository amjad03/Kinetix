<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blockly</title>
<style>
html,body{margin:0;height:100%;font-family:sans-serif}
#bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#eef}
#bar button{font-size:16px;padding:6px 14px}
#wrap{position:absolute;top:44px;bottom:90px;left:0;right:0}
#blocklyDiv{height:100%;width:100%}
#out{position:absolute;bottom:0;left:0;right:0;height:90px;margin:0;padding:6px 10px;box-sizing:border-box;overflow:auto;background:#111;color:#8f8;font:14px monospace}
</style>
<script src="blockly_compressed.js"></script>
<script src="blocks_compressed.js"></script>
<script src="javascript_compressed.js"></script>
<script src="msg_en.js"></script>
</head><body>
<div id="bar"><button id="run">Run</button><button id="clr">Clear output</button><span>Blockly, Google LLC, Apache-2.0</span></div>
<div id="wrap"><div id="blocklyDiv"></div></div>
<pre id="out"></pre>
<script>
var toolbox={kind:'categoryToolbox',contents:[
 {kind:'category',name:'Logic',colour:'210',contents:[{kind:'block',type:'controls_if'},{kind:'block',type:'logic_compare'},{kind:'block',type:'logic_operation'},{kind:'block',type:'logic_boolean'}]},
 {kind:'category',name:'Loops',colour:'120',contents:[{kind:'block',type:'controls_repeat_ext'},{kind:'block',type:'controls_whileUntil'},{kind:'block',type:'controls_for'}]},
 {kind:'category',name:'Math',colour:'230',contents:[{kind:'block',type:'math_number'},{kind:'block',type:'math_arithmetic'},{kind:'block',type:'math_single'},{kind:'block',type:'math_random_int'}]},
 {kind:'category',name:'Text',colour:'160',contents:[{kind:'block',type:'text'},{kind:'block',type:'text_print'},{kind:'block',type:'text_join'}]},
 {kind:'category',name:'Variables',custom:'VARIABLE',colour:'330'},
 {kind:'category',name:'Functions',custom:'PROCEDURE',colour:'290'}]};
var ws=Blockly.inject('blocklyDiv',{toolbox:toolbox,trashcan:true,media:'media/'});
var out=document.getElementById('out');
window.alert=function(m){out.textContent+=m+'\n';};
document.getElementById('run').onclick=function(){
  var code=Blockly.JavaScript.workspaceToCode(ws);
  try{ (new Function(code))(); }catch(e){ out.textContent+='Error: '+e.message+'\n'; }
};
document.getElementById('clr').onclick=function(){out.textContent='';};
</script></body></html>
