name: kinetix_parent
description: "KINETIX Parent App: attendance, homework, class participation, shared class boards and lesson recordings for parents."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kinetix_ui:
    path: ../../packages/kinetix_ui
  kinetix_ink:
    path: ../../packages/kinetix_ink
  kinetix_lesson:
    path: ../../packages/kinetix_lesson
  http: ^1.6.0
  url_launcher: ^6.3.3
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  razorpay_flutter: ^1.4.7
  crypto: ^3.0.7
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  socket_io_client: ^3.1.6
  # Bus screen: OpenStreetMap tiles.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
