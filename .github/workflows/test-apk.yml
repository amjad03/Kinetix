# Test APKs for phones and tablets: the four apps in demo mode (sample data, no server needed),
# signed with a cached test key (the CI debug key), published as the "test-build" pre-release so they can be
# downloaded on a phone. Not for the Play Store: release builds use release.yml.
#
# Runs on pushes to the development branch that touch the apps, or by hand. Set the repository
# variable KINETIX_API_URL once a server is deployed; the APKs then also work against it (demo
# mode stays available from the sign-in screen).
name: Test APKs

on:
  push:
    branches: ['claude/kinetix-ecosystem-overview-lpphjn']
    paths:
      - 'apps/board/**'
      - 'apps/teacher/**'
      - 'apps/parent/**'
      - 'apps/student/**'
      - 'packages/kinetix_*/**'
      - '.github/workflows/test-apk.yml'
  workflow_dispatch:

concurrency:
  group: test-apk
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [teacher, parent, student, board]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Python for the Code lab (board and Student App); not committed, pinned by checksum.
      - if: matrix.app == 'board' || matrix.app == 'student'
        run: bash "$GITHUB_WORKSPACE/packages/kinetix_cs/tool/fetch_pyodide.sh"
      # Gate the APK on the app's own checks: a broken app never reaches the test-build release.
      - run: flutter analyze
      - run: flutter test
      # One test key for every run, so a new build installs over the previous one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kinetix-test-signing-${{ matrix.app }}-v1
      - name: Build demo APK
        env:
          # Signs the release build with the debug key (test builds only; see build.gradle.kts).
          KINETIX_TEST_SIGNING: 'true'
          API_URL: ${{ vars.KINETIX_API_URL || 'https://demo.kinetix.invalid' }}
        run: >-
          flutter build apk --release
          --dart-define=KINETIX_DEMO=true
          --dart-define=KINETIX_API_URL="$API_URL"
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk "kinetix-${{ matrix.app }}-demo.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: kinetix-${{ matrix.app }}-demo
          path: apps/${{ matrix.app }}/kinetix-${{ matrix.app }}-demo.apk
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - name: Replace the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete test-build --repo "$REPO" --yes --cleanup-tag || true
          gh release create test-build apks/*.apk --repo "$REPO" --target "$SHA" --prerelease \
            --title "Test APKs (demo mode) — build ${{ github.run_number }}" \
            --notes "Demo builds of the KINETIX apps with sample data; no server needed. Install on Android: download the APK on the phone, allow installing from this source, open it. New builds install over the previous ones (same test key). Not for the Play Store."
