# Zynetix builds: release APKs for board, teacher, student, parent, and the board macOS app (unsigned).
# Android is signed with the CI debug key (see KINETIX_TEST_SIGNING in build.gradle.kts).
name: Zynetix builds

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL baked into the apps (KINETIX_API_URL), e.g. http://192.168.1.20:4000. Empty: the KINETIX_API_URL variable, or none.'
        required: false
        default: ''
  push:
    branches: ['claude/kinetix-ecosystem-overview-*']
    paths:
      - 'apps/board/**'
      - 'apps/teacher/**'
      - 'apps/parent/**'
      - 'apps/student/**'
      - 'packages/kinetix_*/**'
      - '.github/workflows/zynetix-builds.yml'

concurrency:
  group: zynetix-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  API_URL: ${{ inputs.api_url || vars.KINETIX_API_URL || '' }}

jobs:
  android:
    name: android-${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [board, teacher, student, parent]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - if: matrix.app == 'board' || matrix.app == 'student'
        run: bash "$GITHUB_WORKSPACE/packages/kinetix_cs/tool/fetch_pyodide.sh"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kinetix-test-signing-${{ matrix.app }}-v1
      - name: Build release APK (debug-signed)
        env:
          KINETIX_TEST_SIGNING: 'true'
        run: >-
          flutter build apk --release

          --dart-define=KINETIX_API_URL="$API_URL"
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk "zynetix-${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: zynetix-${{ matrix.app }}-android
          path: apps/${{ matrix.app }}/zynetix-${{ matrix.app }}.apk
          retention-days: 30

  macos:
    name: macos-board
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/board
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get --enforce-lockfile
      - run: bash "$GITHUB_WORKSPACE/packages/kinetix_cs/tool/fetch_pyodide.sh"
      - name: Build macOS release
        run: >-
          flutter build macos --release

          --dart-define=KINETIX_API_URL="$API_URL"
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}
      - name: Zip the app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/zynetix-board-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zynetix-board-macos
          path: zynetix-board-macos.zip
          retention-days: 30
