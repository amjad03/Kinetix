<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KINETIX 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16191e; touch-action: none; -webkit-user-select: none; user-select: none; }
  body.light { background: #f4f1ea; }
  #stage, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #lines polyline { fill: none; stroke: #f5f5f5; stroke-width: 1.6; }
  #lines circle { fill: #f5f5f5; }
  #lines .dim { opacity: 0.45; }
  body.light #lines polyline { stroke: #1c1c1c; }
  body.light #lines circle { fill: #1c1c1c; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .label { position: absolute; transform: translate(6px, -50%); max-width: 13em; pointer-events: auto; cursor: pointer;
    font: 600 15px/1.25 system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Kannada", sans-serif;
    color: #fff; background: rgba(20, 22, 26, 0.78); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); }
  .label.left { transform: translate(calc(-100% - 6px), -50%); }
  .label.dim { opacity: 0.5; }
  .label.picked { background: #f2b33d; color: #15181c; border-color: #f2b33d; }
  body.light .label { color: #111; background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.12); }
  body.light .label.picked { background: #f2b33d; }
</style>
</head>
<body>
<div id="stage"></div>
<svg id="lines"></svg>
<div id="labels"></div>
<script>if (new URLSearchParams(location.search).get('theme') === 'light') document.body.className = 'light';</script>
<script src="viewer.js"></script>
</body>
</html>
