name: kinetix_lessons
description: The Zynetix lesson blocks (whiteboard scenes, interactives, activities, challenges, worked examples, quick checks) for the Classroom edition's Lessons tab, ported from the Zynetix board. Offline; no AI.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  kinetix_3d:
    path: ../kinetix_3d
  kinetix_animations:
    path: ../kinetix_animations
  kinetix_cs:
    path: ../kinetix_cs
  kinetix_labs:
    path: ../kinetix_labs
  kinetix_ui:
    path: ../kinetix_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
