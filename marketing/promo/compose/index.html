<!doctype html>
<html><head><meta charset="utf-8"><title>Zynetix promo</title>
<style>
@font-face{font-family:Flex;src:url(/packages/zynetix_ui/fonts/SansFlex-400.ttf);font-weight:400}
@font-face{font-family:Flex;src:url(/packages/zynetix_ui/fonts/SansFlex-500.ttf);font-weight:500}
@font-face{font-family:Flex;src:url(/packages/zynetix_ui/fonts/SansFlex-600.ttf);font-weight:600}
@font-face{font-family:Flex;src:url(/packages/zynetix_ui/fonts/SansFlex-700.ttf);font-weight:700}
@font-face{font-family:FlexD;src:url(/packages/zynetix_ui/fonts/SansFlexDisplay-500.ttf);font-weight:500}
@font-face{font-family:Deva;src:url(/packages/zynetix_ui/fonts/NotoSansDevanagari-700.ttf);font-weight:700}
@font-face{font-family:Knda;src:url(/packages/zynetix_ui/fonts/NotoSansKannada-700.ttf);font-weight:700}
@font-face{font-family:Mono;src:url(/packages/zynetix_ui/fonts/JetBrainsMono-700.ttf);font-weight:700}
@font-face{font-family:Mono;src:url(/packages/zynetix_ui/fonts/JetBrainsMono-400.ttf);font-weight:400}
:root{--bg:#06040f;--vi:#8B5CF6;--ma:#E879F9;--cy:#22D3EE;--li:#A3E635;--am:#FBBF24;--tx:#F4F1FF;--mut:#9C93C9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}

body{font-family:Flex,Deva,Knda,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0}
#stage,.scene,.cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
.cam{transform-origin:0 0;will-change:transform}
.a{position:absolute}
.glass{position:absolute;border-radius:28px;background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 1px rgba(139,92,246,.10) inset}
.light{background:#fff;color:#14122b}
.dsp{font-family:FlexD,Flex;font-weight:500;letter-spacing:-.02em}
.mono{font-family:Mono,monospace}
.grad{background:linear-gradient(90deg,var(--cy),var(--vi) 50%,var(--ma));-webkit-background-clip:text;color:transparent}
.pill{position:absolute;padding:8px 20px;border-radius:999px;font-weight:600;font-size:24px;white-space:nowrap}
iframe{border:0;position:absolute;background:transparent}
.vtxt .label{position:absolute;transform:translate(6px,-50%);max-width:13em;font:600 19px/1.25 Deva,Knda,sans-serif;color:#fff;background:rgba(20,16,50,.82);padding:3px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
.vtxt .label.left{transform:translate(calc(-100% - 6px),-50%)}
.vtxt .label.dim{opacity:.5}
.vtxt .label.picked{background:#FBBF24;color:#14122b}
.vlines polyline{fill:none;stroke:#f5f5f5;stroke-width:1.6}.vlines circle{fill:#f5f5f5}.vlines .dim{opacity:.45}

#hud>*{position:absolute}
#kw{left:96px;top:150px;font-family:FlexD,Flex;font-weight:500;font-size:112px;letter-spacing:-.03em;line-height:1;white-space:nowrap;transform-origin:0 50%;filter:drop-shadow(0 6px 30px rgba(139,92,246,.55))}
#cap{left:0;width:1920px;bottom:44px;text-align:center;font-size:43px;font-weight:600;line-height:1.25;padding:0 220px}
#cap span{display:inline-block;margin:0 .14em;color:#fff;opacity:.55;text-shadow:0 3px 18px rgba(0,0,0,.9);transition:none}
#scrim{left:0;right:0;bottom:0;height:260px;background:linear-gradient(0deg,rgba(6,4,15,.92),rgba(6,4,15,0))}
#prog{left:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--ma));box-shadow:0 0 18px var(--vi)}
#chap{right:70px;top:46px;display:flex;gap:10px;position:absolute}
#chap b{position:static;padding:7px 16px;border-radius:999px;font-size:20px;font-weight:600;letter-spacing:.08em;color:var(--mut);border:1.5px solid rgba(255,255,255,.12);background:rgba(10,8,30,.4)}
#chap b.on{color:#fff;border-color:var(--cy);background:rgba(34,211,238,.16);box-shadow:0 0 24px rgba(34,211,238,.35)}
#brand{left:70px;top:40px;display:flex;align-items:center;gap:16px;position:absolute;font-family:FlexD,Flex;font-size:34px;letter-spacing:.24em;font-weight:500}
#brand svg{position:static}
#ring{border-radius:50%;border:3px solid var(--cy);pointer-events:none}
</style></head>
<body>
<canvas id="bg" width="1920" height="1080"></canvas>
<div id="stage"></div>
<div id="hud">
 <div id="scrim"></div>
 <div id="brand"><svg width="54" height="54" viewBox="0 0 54 54"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#E879F9"/></linearGradient></defs><rect width="54" height="54" rx="15" fill="url(#lg)"/><path d="M15 15h24L21 39h18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ZYNETIX</span></div>
 <div id="chap"></div>
 <div id="ring"></div>
 <div id="kw" class="grad"></div>
 <div id="cap"></div>
 <div id="prog"></div>
</div>
<script src="timeline.js"></script>
<script src="models.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="scenes1.js"></script>
<script src="scenes2.js"></script>
<script src="scenes3.js"></script>
<script src="boot.js"></script>
</body></html>
